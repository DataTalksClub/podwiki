name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout podwiki
        uses: actions/checkout@v6
        with:
          path: podwiki
      - name: Checkout website source
        uses: actions/checkout@v6
        with:
          repository: DataTalksClub/datatalksclub.github.io
          path: datatalksclub.github.io
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        working-directory: podwiki
        run: python -m pip install uv -r requirements.txt
      - name: Build and check site
        working-directory: podwiki
        run: make ci-site
        env:
          JEKYLL_ENV: production
      - name: Build Lambda search package
        working-directory: podwiki
        run: make ci-lambda-package
