name: Deploy site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout podwiki
        uses: actions/checkout@v6
        with:
          path: podwiki
      - name: Checkout website source
        uses: actions/checkout@v6
        with:
          repository: DataTalksClub/datatalksclub.github.io
          path: datatalksclub.github.io
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Python dependencies
        working-directory: podwiki
        run: python -m pip install uv -r requirements.txt
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build and check site
        working-directory: podwiki
        run: make ci-site BASEURL="${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: podwiki/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
